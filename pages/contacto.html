<body>
    <header class="topheader">
      <nav class="topnav">

          <img src="/img/Wall01.png" alt="logoprincipal">

    <main>
      <!-- <div class="horizontal-padding vertical-padding">
        <section class="" id=""></section>
      </div> -->

      <div class="horizontal-padding vertical-padding">
        <section class="contacto" id="contacto">
          <h2 class="contacto-titulo">Contacto</h2>
          <div class="contacto-detalles">
            <div class="contacto-detalles-grupo">
              <p class="contacto-label">Dirección:</p>
              <p class="contacto-texto">Córdoba, Argentina</p>
            </div>

            <div class="contacto-detalles-grupo">
              <p class="contacto-label">Email:</p>
              <p class="contacto-texto">wallseguriad@gmail.com</p>
            </div>

            <div class="contacto-detalles-grupo">
              <p class="contacto-texto">Deje su mensaje y con gusto le responderemos.</p>
            </div>
          </div>

          <form class="contacto-formulario">
            <div class="contacto-formulario-grupo">
              <label for="">Nombre</label>
              <input required type="text" name="nombre" id="nombre">
            </div>

            <div class="contacto-formulario-grupo">
              <label for="">Email</label>
              <input required type="email" name="email" id="email">
            </div>

            <div class="contacto-formulario-grupo">
              <label for="">Mensaje</label>
              <textarea required name="mensaje" id="mensaje" rows="6"></textarea>
            </div>

            <button type="submit" class="boton-contacto-form">Enviar</button>
          </form>

          <nav class="social">
            <ul class="social-list">
              <li>
                <a target="_blank" href="https://x.com/?lang=es">
                    <img src="/img/redesSociales/twitter.svg" alt="twitter perfil">
                </a>
            </li>

            <li>
                <a target="_blank" href="https://www.facebook.com/">
                    <img src="/img/redesSociales/facebook.svg" alt="facebook perfil">
                </a>
            </li>

            <li>
                <a target="_blank" href="https://www.instagram.com/">
                    <img src="/img/redesSociales/instagram.svg" alt="instragram perfil">
                </a>
            </li>

            <li>
                <a target="_blank" href="https://www.youtube.com/">
                    <img src="/img/redesSociales/youtube.svg"  alt="youtube perfil">
                </a>
            </li>

            </ul>

          </nav>

        </section>

      </div>
